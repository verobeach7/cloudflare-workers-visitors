<!DOCTYPE html>
<html>
	<head>
		<title>Chat</title>
	</head>
	<body>
		<h1>Chat</h1>
		<button>Connect</button>
		<form action="">
			<input type="text" placeholder="write your msg." />
			<button>Send</button>
		</form>
		<h3>Messages</h3>
		<ul></ul>
		<script>
			const button = document.querySelector('button');
			const form = document.querySelector('form');
			const ul = document.querySelector('ul');
			/* Step 1: 백엔드에 웹소켓 연결 요청을 보냄 */
			button.addEventListener('click', () => {
				const ws = window.location.protocol === 'https' ? 'wss' : 'ws';
				const socket = new WebSocket(`${ws}://${window.location.host}/connect`);
				console.log(socket);
				// socket이 open(연결)되면 연결됨을 알림
				socket.addEventListener('open', () => {
					console.log('Connected');
					form.addEventListener('submit', (event) => {
						event.preventDefault();
						const input = form.querySelector('input');
						// 백엔드에 input의 message를 전달
						socket.send(JSON.stringify({ message: input.value }));
						input.value = '';
					});
				});
				// socket을 통해 메시지가 전달되면 이를 콘솔에 표시함
				socket.addEventListener('message', (event) => {
					const data = JSON.parse(event.data);
					const li = document.createElement('li');
					li.innerText = data.message;
					ul.appendChild(li);
				});
			});
		</script>
	</body>
</html>
